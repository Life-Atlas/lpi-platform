[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lpi-platform"
version = "0.1.0"
description = "Life Programmable Interface — goal registry, activity signals, recommendation engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "supabase>=2.31.0",
    "starlette>=1.3.1",
    "anyio>=4.13.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0",
    # ── LLM / reasoning layer (Phase 4 — Core Algorithm) ────────────────────
    # langgraph : state-machine graph used by src/lpi/langgraph_agent.py
    # anthropic : paid Claude API (commented-out code path in _call_llm,
    #             re-enabled once we have an ANTHROPIC_API_KEY)
    # groq      : free-tier LLM API — active default until then
    "langgraph>=0.2.0",
    "anthropic>=0.39.0",
    "groq>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7",
    "types-requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "once::DeprecationWarning",
    "ignore:.*timeout.*:DeprecationWarning",
    "ignore:.*verify.*:DeprecationWarning",
    "ignore:Using.*httpx.*starlette.testclient",
    
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
